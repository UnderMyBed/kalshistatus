<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kalshistatus.dev — Status &amp; performance for the Kalshi API</title>
    <meta
      name="description"
      content="Status &amp; performance for the Kalshi API. For the engineers shipping against it."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/Inter-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/JetBrainsMono-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta property="og:title" content="kalshistatus.dev" />
    <meta
      property="og:description"
      content="Status &amp; performance for the Kalshi API. For the engineers shipping against it."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://kalshistatus.dev/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://kalshistatus.dev/og.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="header">
      <div class="header-inner">
        <a class="wordmark" href="/" aria-label="kalshistatus.dev home">
          <span class="wordmark-dot unknown" id="wordmark-dot" aria-hidden="true">●</span>
          <span>kalshistatus.dev</span>
        </a>
        <div class="header-controls">
          <button class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">auto</button>
        </div>
      </div>
    </header>

    <main id="main">
      <div class="container">
        <section class="status-banner" aria-label="Overall status">
          <div class="banner-status">
            <span class="banner-dot unknown" id="banner-dot" aria-label="unknown">●</span>
            <span id="banner-text">Loading…</span>
          </div>
          <div class="banner-meta">
            <span id="banner-age"></span>
            <span id="banner-cron"></span>
          </div>
          <div class="banner-uptime" id="banner-uptime" aria-label="Uptime windows"></div>
        </section>

        <section class="card" id="section-exchange" aria-label="Exchange status">
          <div class="section-header"><h2>Exchange</h2></div>
          <div class="exchange-content" id="exchange-content">
            <div class="loading-text">Loading…</div>
          </div>
        </section>

        <noscript>
          <section class="card" aria-label="JavaScript required">
            <div class="loading-text">
              This dashboard renders live data via JavaScript. The raw API is
              <a href="/api/status">/api/status</a> — same shape, no JS required.
            </div>
          </section>
        </noscript>

        <section class="card" id="section-latency" aria-label="Latency, last 24h">
          <div class="section-header">
            <h2>Latency · 24h</h2>
            <span class="section-meta" id="latency-meta"></span>
          </div>
          <div class="latency-chart" id="latency-chart">
            <div class="loading-text">Loading…</div>
          </div>
        </section>

        <section class="card" id="section-endpoints" aria-label="Endpoints">
          <div class="section-header"><h2>Endpoints</h2></div>
          <div class="section-body" id="endpoints-body">
            <div class="loading-text">Loading…</div>
          </div>
        </section>
      </div>
    </main>

    <footer>
      <div class="container footer-inner">
        <a href="https://github.com/UnderMyBed/kalshistatus">Source</a>
        <span class="footer-sep">·</span>
        <a href="/openapi.yaml">OpenAPI</a>
        <span class="footer-sep">·</span>
        <span>Built by <a href="https://github.com/UnderMyBed">@UnderMyBed</a></span>
        <span class="footer-version" id="footer-version"></span>
        <div class="footer-disclaimer">
          Unofficial. Not affiliated with Kalshi. Data is best-effort with no guarantees of accuracy
          or availability.
        </div>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
