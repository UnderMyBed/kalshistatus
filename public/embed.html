<!doctype html>
<html lang="en" data-theme="auto">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalshi API Status</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #111111;
        --fg-muted: #525252;
        --accent: #2563eb;
        --status-operational: #22c55e;
        --status-degraded: #eab308;
        --status-down: #ef4444;
        --status-unknown: #71717a;
        --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      }
      [data-theme='dark'] {
        --bg: #0a0a0a;
        --fg: #e5e5e5;
        --fg-muted: #a3a3a3;
        --accent: #60a5fa;
      }
      @media (prefers-color-scheme: dark) {
        [data-theme='auto'] {
          --bg: #0a0a0a;
          --fg: #e5e5e5;
          --fg-muted: #a3a3a3;
          --accent: #60a5fa;
        }
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--fg);
        font-size: 0.875rem;
        line-height: 1.4;
        padding: 0.75rem;
      }
      .embed-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--status-unknown);
      }
      .status-dot.operational {
        background: var(--status-operational);
      }
      .status-dot.degraded {
        background: var(--status-degraded);
      }
      .status-dot.partial_outage,
      .status-dot.major_outage,
      .status-dot.down {
        background: var(--status-down);
      }
      .embed-label {
        flex: 1;
      }
      .embed-link {
        color: var(--fg-muted);
        font-size: 0.75rem;
        text-decoration: none;
      }
      .embed-link:hover {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="embed-row">
      <span id="embed-dot" class="status-dot" aria-hidden="true"></span>
      <span id="embed-label" class="embed-label">Loading…</span>
      <a
        class="embed-link"
        href="https://kalshistatus.dev"
        target="_blank"
        rel="noopener noreferrer"
        >kalshistatus.dev ↗</a
      >
    </div>
    <script>
      (async function () {
        const dot = document.getElementById('embed-dot');
        const label = document.getElementById('embed-label');
        try {
          const res = await fetch('/api/status?env=prod');
          if (!res.ok) throw new Error('non-ok');
          const data = await res.json();
          const status = data.status || 'unknown';
          const statusLabel = status.replace(/_/g, ' ');
          dot.className = 'status-dot ' + status;
          label.textContent = 'Kalshi API: ' + statusLabel;
        } catch {
          label.textContent = 'Kalshi API: status unavailable';
        }
        window.parent.postMessage(
          { type: 'kalshi-status-height', height: document.body.scrollHeight },
          '*',
        );
      })();
    </script>
  </body>
</html>
