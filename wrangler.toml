name = "kalshi-status"
main = "src/index.ts"
compatibility_date = "2026-05-23"
workers_dev = true

[[routes]]
pattern = "kalshistatus.dev"
custom_domain = true

[[routes]]
pattern = "www.kalshistatus.dev"
custom_domain = true

[assets]
directory = "./public"
binding   = "ASSETS"

[[d1_databases]]
binding       = "DB"
database_name = "kalshi_status"
database_id   = "PLACEHOLDER_RUN_wrangler_d1_create"

[triggers]
crons = ["*/5 * * * *", "0 0 * * *"]

[vars]
KALSHI_PROD_REST_BASE   = "https://api.elections.kalshi.com/trade-api/v2"
SNAPSHOT_RETENTION_DAYS = "30"
VERSION                 = "2.0.0"
COMMIT_SHA              = "dev"

[observability]
enabled            = true
head_sampling_rate = 1.0
