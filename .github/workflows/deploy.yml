name: Deploy
on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run fmt:check
      - run: npm run type-check
      - run: npm test

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 3ec5942b7fcb9720c6888a6422d0f8cc
      - name: Sync Grafana dashboard
        if: ${{ secrets.GRAFANA_API_TOKEN != '' }}
        continue-on-error: true
        run: node scripts/grafana-setup.mjs
        env:
          GRAFANA_STACK_URL: https://shipman.grafana.net
          GRAFANA_SA_TOKEN: ${{ secrets.GRAFANA_API_TOKEN }}
